<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tfKeycap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243042" />
      <stop offset="100%" stop-color="#111823" />
    </linearGradient>
    <linearGradient id="tfDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16202c" />
      <stop offset="100%" stop-color="#0d141d" />
    </linearGradient>
    <linearGradient id="tfCaret" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Keycap base / shadow -->
  <rect x="2" y="4" width="60" height="56" rx="14" fill="#080c12" />
  <!-- Main keycap body -->
  <rect x="2" y="2" width="60" height="54" rx="14" fill="url(#tfKeycap)" stroke="#38495f" stroke-width="2" />
  <!-- Top keycap concave dish -->
  <rect x="7" y="6" width="50" height="42" rx="9" fill="url(#tfDish)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />

  <!-- Bold, clean monospace lowercase 't' -->
  <path d="M26 17v8h-6v6h6v12c0 4.2 2.6 6.5 7.5 6.5h5.5v-6h-4.2c-1.8 0-2.8-.8-2.8-2.5V31h7v-6h-7v-8z" fill="#f8fafc" />

  <!-- Glowing live typing caret cursor -->
  <rect x="42.5" y="20" width="5.5" height="26" rx="2.75" fill="url(#tfCaret)" />
</svg>